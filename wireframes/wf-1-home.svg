"112" width="192.0" height="32" fill="#4472C4" stroke="#7F7F7F" stroke-width="1.5"/><text x="308.0" y="132.55" font-family="Helvetica,Arial" font-size="13" fill="#FFFFFF" text-anchor="middle">About</text><rect x="404.0" y="112" width="192.0" height="32" fill="#4472C4" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="132.55" font-family="Helvetica,Arial" font-size="13" fill="#FFFFFF" text-anchor="middle">Plans &amp; Services</text><rect x="596.0" y="112" width="192.0" height="32" fill="#4472C4" stroke="#7F7F7F" stroke-width="1.5"/><text x="692.0" y="132.55" font-family="Helvetica,Arial" font-size="13" fill="#FFFFFF" text-anchor="middle">Register</text><rect x="788.0" y="112" width="192.0" height="32" fill="#4472C4" stroke="#7F7F7F" stroke-width="1.5"/><text x="884.0" y="132.55" font-family="Helvetica,Arial" font-size="13" fill="#FFFFFF" text-anchor="middle">Contact</text><rect x="20" y="152" width="960" height="72" fill="#ADCCE8" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="177.2" font-family="Helvetica,Arial" font-size="12" fill="#000000" text-anchor="middle">BANNER</text><text x="500.0" y="192.2" font-family="Helvetica,Arial" font-size="12" fill="#000000" text-anchor="middle">"See what your portfolio is actually telling you"</text><text x="500.0" y="207.2" font-family="Helvetica,Arial" font-size="12" fill="#000000" text-anchor="middle">leads with the portfolio you already own - no urgency, no countdown</text><rect x="20" y="232" width="960" height="54" fill="#BFE3D0" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="255.85" font-family="Helvetica,Arial" font-size="11" fill="#000000" text-anchor="middle">THE PROMISE  -  "We explain what is happening. We never tell you what to buy or sell."</text><text x="500.0" y="269.85" font-family="Helvetica,Arial" font-size="11" fill="#000000" text-anchor="middle">stated near the top as a trust argument, not buried in the footer</text><rect x="20" y="294" width="960" height="104" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/><text x="34" y="314" font-family="Helvetica,Arial" font-size="12" font-weight="bold">WORKED EXAMPLE - shown before any sign-up</text><rect x="34" y="322" width="932" height="68" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="346.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">"Why did $340 in franking credits appear in my account?"</text><text x="500.0" y="359.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">definition list: what happened / what it is / where it shows up / what we are NOT saying</text><text x="500.0" y="372.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">descriptive only - no score, no rating, no verdict</text><rect x="20" y="406" width="235" height="64" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/><text x="137.5" y="434.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Translates</text><text x="137.5" y="448.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">your holdings</text><rect x="265" y="406" width="235" height="64" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/><text x="382.5" y="434.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Explains what</text><text x="382.5" y="448.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">changed, and why</text><rect x="510" y="406" width="235" height="64" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/><text x="627.5" y="434.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Teaches from</text><text x="627.5" y="448.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">your portfolio</text><rect x="755" y="406" width="235" height="64" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/><text x="872.5" y="434.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Never</text><text x="872.5" y="448.85" font-family="Helvetica,Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">recommends</text><rect x="20" y="478" width="960" height="66" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="501.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">ADDING A PORTFOLIO TAKES THREE STEPS</text><text x="500.0" y="514.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">1. enter what you hold (read-only)   2. we describe what is in it   3. you decide, elsewhere</text><text x="500.0" y="527.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">short linear flow used only for this one action - the rest of the site stays open-ended</text><rect x="20" y="552" width="960" height="50" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="574.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">RECENT EXPLANATIONS  -  three cards, each link names its own article</text><text x="500.0" y="587.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">(not three identical "Read more" links); card images are decorative</text><rect x="20" y="610" width="960" height="36" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="618.5" font-family="Helvetica,Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">FOOTER</text><text x="500.0" y="631.5" font-family="Helvetica,Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">address . phone . email . hours . site map links</text><text x="500.0" y="644.5" font-family="Helvetica,Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">"factual information and general explanations only - no personal advice"</text></svg>