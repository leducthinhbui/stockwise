="Helvetica,Arial" font-size="12" font-weight="bold">WHERE STOCKWISE SITS - comparison table</text><rect x="34" y="342" width="932" height="84" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="368.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">rows = a broker / a financial adviser / StockWise</text><text x="500.0" y="381.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">columns = what its job is</text><text x="500.0" y="394.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">how it is paid</text><text x="500.0" y="407.0" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">the differentiator stated explicitly rather than implied</text><rect x="20" y="444" width="480" height="86" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="260.0" y="477.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">WE WILL</text><text x="260.0" y="490.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">describe holdings, explain what changed,</text><text x="260.0" y="503.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">define every term, say when you need a licensed adviser</text><rect x="512" y="444" width="468" height="86" fill="#BFE3D0" stroke="#7F7F7F" stroke-width="1.5"/><text x="746.0" y="477.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">WE WILL NOT</text><text x="746.0" y="490.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">recommend, score or rate, take referral fees,</text><text x="746.0" y="503.5" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">use countdowns or "don't miss out" messaging</text><rect x="20" y="540" width="960" height="62" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/><text x="500.0" y="574.85"