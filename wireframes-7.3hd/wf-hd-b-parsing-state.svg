<rect x="240" y="230" width="520" height="220" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="500" y="258" font-family="Helvetica,Arial" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold">"broker-statement-march.pdf"</text>
<rect x="280" y="280" width="440" height="26" fill="#E7E6E6" stroke="#7F7F7F" stroke-width="1.5"/>
