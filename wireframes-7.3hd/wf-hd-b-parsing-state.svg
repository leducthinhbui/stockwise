<text x="500" y="297.5" font-family="Helvetica,Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Parsing… 59%</text>
<text x="500" y="326" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">Running in a background thread (Web Worker)</text>
<text x="500" y="342" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">so the page stays responsive while this file</text>
<text x="500" y="358" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">is read and parsed on this device.</text>
<rect x="340" y="378" width="320" height="44" fill="#BFE3D0" stroke="#2E7D32" stroke-width="1.5"/>
<text x="500" y="396" font-family="Helvetica,Arial" font-size="10" fill="#1B5E20" text-anchor="middle" font-weight="bold">The file is not uploaded.</text>
<text x="500" y="412" font-family="Helvetica,Arial" font-size="10" fill="#1B5E20" text-anchor="middle" font-weight="bold">It never leaves your browser.</text>

<rect x="20" y="470" width="960" height="110" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="34" y="490" font-family="Helvetica,Arial" font-size="11" fill="#000000" text-anchor="start" font-weight="bold">ACCESSIBILITY NOTE</text>
<text x="500" y="510" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">Progress is exposed via aria-live so a screen reader announces it periodically,</text>
<text x="500" y="526" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">not on every percentage tick. A visible, focusable Cancel button is always present</text>
<text x="500" y="542" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">— drag-and-drop is optional, never the only way to supply the file.</text>

<rect x="20" y="654" width="960" height="16" fill="#BFBFBF" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="500" y="665.5" font-family="Helvetica,Arial" font-size="9" fill="#FFFFFF" text-anchor="middle">FOOTER — address . phone . email . hours . site map links . "factual information and general explanations only"</text>
<text x="500" y="688" font-family="Helvetica,Arial" font-size="13" fill="#000000" text-anchor="middle" font-weight="bold">Wireframe B — Local parsing state — Web Worker, no network activity</text>
</svg>