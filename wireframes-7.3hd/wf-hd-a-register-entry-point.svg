<text x="260" y="308" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">or paste a short text summary.</text>
<text x="260" y="326" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">Good for a handful of holdings.</text>
<text x="260" y="344" font-family="Helvetica,Arial" font-size="10" fill="#000000" text-anchor="middle">Slow, error-prone for a full portfolio.</text>

